meta:
  environment: node
  toolchain:
    name: npm
    version: 18

build:
  additionalCommands: npm run build
  artifacts:
    "api": /
    "dist": /
    "public": /
    "node_modules": /
    "server.js": /
    "package.json": /
    "package-lock.json": /

run:
  scriptName: server.js
  containerPort: 8080
